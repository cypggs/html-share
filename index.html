<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Share · 精美 HTML 分享馆</title>
<meta name="description" content="一个用来收集和分享精美 HTML 页面的静态站点。">
<style>
:root {
  --bg: #05070a;
  --bg2: #0b1020;
  --card: rgba(255,255,255,.04);
  --border: rgba(255,255,255,.08);
  --txt: #e8ecf4;
  --sub: #8b98ad;
  --cyan: #22d3ee;
  --violet: #a78bfa;
  --pink: #f472b6;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}
.glow {
  position: fixed; border-radius: 50%; filter: blur(120px);
  opacity: .18; pointer-events: none; z-index: 0;
}
.g1 { width: 500px; height: 500px; background: #0ea5e9; top: -140px; left: -120px; }
.g2 { width: 420px; height: 420px; background: #7c3aed; bottom: 10%; right: -140px; }

header {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 120px 24px 40px;
  text-align: center;
}
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; letter-spacing: 2px; color: var(--cyan);
  border: 1px solid rgba(34,211,238,.3); border-radius: 99px;
  padding: 6px 16px; margin-bottom: 22px;
}
h1 {
  font-size: clamp(36px, 6vw, 64px); font-weight: 900;
  letter-spacing: -1px; line-height: 1.1; margin-bottom: 16px;
  background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.subtitle { color: var(--sub); font-size: 18px; max-width: 640px; margin: 0 auto 32px; }
.search {
  position: relative; max-width: 540px; margin: 0 auto 48px;
}
.search input {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 20px 14px 46px;
  color: var(--txt); font-size: 15px; outline: none; transition: .2s;
}
.search input:focus {
  border-color: rgba(34,211,238,.4);
  background: rgba(255,255,255,.06);
}
.search svg {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--sub);
}

main {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 0 24px 80px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.card {
  display: block; background: var(--card);
  border: 1px solid var(--border); border-radius: 18px;
  padding: 24px; text-decoration: none; color: inherit;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  border-color: rgba(167,139,250,.25);
}
.card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 12px;
}
.card-date { font-size: 12px; color: var(--sub); }
.card-tags {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
}
.tag {
  font-size: 11px; color: var(--cyan);
  background: rgba(34,211,238,.1);
  border: 1px solid rgba(34,211,238,.2);
  padding: 3px 10px; border-radius: 99px;
}
.card h2 {
  font-size: 19px; font-weight: 700; margin-bottom: 10px; line-height: 1.35;
}
.card p {
  color: var(--sub); font-size: 14px; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.empty { text-align: center; color: var(--sub); padding: 80px 0; }

footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--border);
  padding: 30px 24px; text-align: center;
  color: var(--sub); font-size: 13px;
}
footer a { color: var(--cyan); text-decoration: none; }

.add-btn {
  position: fixed; bottom: 24px; right: 24px; z-index: 50;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  color: #000; border: none; border-radius: 50%;
  width: 56px; height: 56px; display: grid; place-items: center;
  box-shadow: 0 8px 24px rgba(34,211,238,.25);
  cursor: pointer; text-decoration: none;
}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<header>
  <div class="badge">HTML SHARE</div>
  <h1>精美 HTML 分享馆</h1>
  <p class="subtitle">把每一次生成的精美 HTML 都收进这里，每一个页面都是一条可直接分享的链接。</p>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="搜索标题、标签或描述…" autocomplete="off">
  </div>
</header>

<main id="gallery"></main>

<footer>
  HTML Share · 由 <a href="https://github.com/cypggs">cypggs</a> 维护 ·
  <a href="https://github.com/cypggs/html-share">GitHub</a>
</footer>

<a class="add-btn" href="https://github.com/cypggs/html-share/blob/main/README.md" target="_blank" title="添加新页面">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</a>

<script>
(async () => {
  const gallery = document.getElementById('gallery');
  const search  = document.getElementById('search');
  let pages = [];
  try {
    const r = await fetch('pages.json', { cache: 'no-store' });
    pages = await r.json();
  } catch (e) {
    gallery.innerHTML = '<div class="empty">暂时还没有页面，快去添加第一个 HTML 吧。</div>';
    return;
  }
  const render = (q = '') => {
    const qe = q.trim().toLowerCase();
    const filtered = pages.filter(p => {
      const hay = (p.title + ' ' + p.description + ' ' + (p.tags || []).join(' ')).toLowerCase();
      return hay.includes(qe);
    });
    if (!filtered.length) {
      gallery.innerHTML = '<div class="empty">没有找到匹配的内容。</div>';
      return;
    }
    gallery.innerHTML = filtered.map(p => `
      <a class="card" href="${p.file}">
        <div class="card-top"><span class="card-date">${p.date || ''}</span></div>
        <h2>${p.title}</h2>
        <p>${p.description || '暂无描述'}</p>
        <div class="card-tags">${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </a>
    `).join('');
  };
  render();
  search.addEventListener('input', e => render(e.target.value));
})();
</script>
</body>
</html>
